services:
  postgres:
    image: postgres:17-alpine
    container_name: sublytic-postgres
    environment:
      POSTGRES_DB: sublytic
      POSTGRES_USER: sublytic
      POSTGRES_PASSWORD: sublytic
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sublytic -d sublytic"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
